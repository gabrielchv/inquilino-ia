[project]
name = "inquilino-ia"
version = "0.1.0"
description = "Citation-grounded RAG assistant over Lei do Inquilinato (Lei 8.245/1991)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=0.3",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic-settings>=2.5",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
